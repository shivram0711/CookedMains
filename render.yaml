# ==============================================================================
# Render.com Infrastructure Blueprint
# Auto-deploys Cooked Mains AI with free tier configuration and Supabase persistence
# ==============================================================================

services:
  - type: web
    name: cooked-mains
    runtime: python
    region: singapore # Closest to India for ultra-low latency
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
