name: CookedMains AI CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Regression & Evaluation Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Essay Pipeline & GS Isolation Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_dummy_key_ci_gate_123' }}
        run: |
          python -m unittest test_essay_regression.py test_essay_pipeline.py

      - name: Run FastAPI Health & API Route Smoke Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_dummy_key_ci_gate_123' }}
        run: |
          python -c "from fastapi.testclient import TestClient; from main import app; client = TestClient(app); resp = client.get('/health'); assert resp.status_code == 200, f'Health check failed: {resp.status_code}'; print('Health Check PASSED: 200 OK')"
