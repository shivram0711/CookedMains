      background-size: 22px 22px;
    }
    .paper-lines {
      background-image: repeating-linear-gradient(

</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Studio Navigation -->

  <script>
    // =========================================================================

    function renderMinimalSingleAd(idx) {
      // -----------------------------------------------------------------------

      // -----------------------------------------------------------------------
      if (idx === 0) {
        return `
          <div id="exportTargetCard" class="relative w-[540px] h-[675px] rounded-[28px] overflow-hidden bg-[#07090F] text-white border border-zinc-800 shadow-2xl flex flex-col justify-between p-8 select-none">

            <!-- Minimal Top Brand Bar -->
            <div class="relative z-10 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <img src="/static/brand_logo_dark.png" onerror="this.style.display='none'" class="h-7 w-auto" alt="Logo" />

                    <!-- Giant Circled Red Stamp -->
                    <div class="mt-3 flex items-center justify-center">
                      <div class="w-24 h-24 rounded-full border-4 border-double border-rose-600 flex flex-col items-center justify-center -rotate-12 bg-rose-50/90 shadow-md">

      // -----------------------------------------------------------------------

            <!-- 2 Contrast Lockscreen Notifications (The Entire Story in 2 Cards) -->
            <div class="relative z-10 space-y-4 my-auto">

              <!-- Notification 1: Coaching Ghosting -->
              <div class="p-4 rounded-3xl bg-white/[0.06] backdrop-blur-xl border border-white/10 shadow-xl opacity-75">
                <div class="flex items-center justify-between mb-1.5">
                  <div class="flex items-center gap-2">
                    <span class="w-5 h-5 rounded-md bg-rose-500/30 flex items-center justify-center text-xs">🐢</span>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-300">₹25,000 TEST SERIES</span>
                  </div>
                  <span class="text-[10.5px] font-mono-code text-rose-400 font-semibold">14 days ago</span>
                </div>

              </div>

              <!-- Notification 2: Cooked Mains Instant Audit -->
              <div class="p-5 rounded-3xl bg-gradient-to-br from-amber-500/20 via-slate-900/95 to-slate-900 backdrop-blur-xl border-2 border-amber-400/60 shadow-[0_0_35px_rgba(245,158,11,0.2)] scale-[1.03]">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center gap-2">
                    <img src="/static/brand_logo_dark.png" onerror="this.style.display='none'" class="h-5 w-auto" alt="Logo" />

      // -----------------------------------------------------------------------
      // SINGLE AD 3: THE TWO TICKETS (₹25,000 COACHING vs ₹0 COOKED MAINS VIP)

      if (idx === 2) {
        return `
          <div id="exportTargetCard" class="relative w-[540px] h-[675px] rounded-[28px] overflow-hidden bg-[#F7F3EB] text-[#141413] border border-stone-300 shadow-2xl flex flex-col justify-between p-8 select-none">

            </div>

            <!-- Footer -->
            <div class="pt-3 border-t-2 border-[#141413] flex items-center justify-between">
              <span class="font-editorial text-xl" contenteditable="true">Upload your handwritten photo now →</span>
              <span class="px-4 py-2 rounded-xl bg-[#141413] text-amber-400 font-mono-code text-xs font-extrabold" contenteditable="true">cookedmains.com</span>
            </div>
          </div>
        `;
      }

      // -----------------------------------------------------------------------
      // SINGLE AD 4: THE BRUTAL BAR CHART (310 HRS READING vs 0 AUDITED)
      // -----------------------------------------------------------------------
      if (idx === 3) {
        return `
          <div id="exportTargetCard" class="relative w-[540px] h-[675px] rounded-[28px] overflow-hidden bg-[#090D16] text-white border border-slate-800 shadow-2xl flex flex-col justify-between p-8 select-none">
            <div class="pointer-events-none absolute inset-0 grain-overlay"></div>

            <div class="relative z-10 flex items-center justify-between">

              <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-mono-code">

              <!-- Bar 2 -->
              <div class="space-y-1.5">

            box1Title: "🛑 EXCUSE #1: “I WROTE MORE PAGES THAN YOU”",
            box1Tag: "REJECTED",
            box1Color: "rose",
            box1Body: `Cooked Mains penalizes generic filler and rewards high-density keywords, Supreme Court judgments, and directive fidelity.`,
            box2Title: "🏆 HOW THE WINNER IS CROWNED",
            box2Tag: "STEP-MARKING PROOF",
            box2Color: "emerald",
            box2Body: `You can see the exact sub-part where your friend beat you (e.g., “Player 1 scored 2.5/3 in Way Forward by citing 2nd ARC Report; Player 2 scored 1.0/3”).`,
            footerLeft: "And the loser has a mandatory penalty...",
            footerRight: "SWIPE →"
          },
          {
            theme: "dark-obsidian",
            badge: "THE LOSER’S REDEMPTION ARC",
            slideNum: "04 / 05",
            headline: `Loser Buys Chai—AND Has To <span class="italic text-emerald-400">Beat The Winner’s Score</span> In Rewrite Lab.`,
            subtext: `You don’t leave the table until both of you cross 6.0/10 on that question:`,
            box1Title: "🔄 MANDATORY REWRITE EVOLUTION LAB",
            box1Tag: "UNLOCK +3.0 MARKS",
            box1Color: "amber",
            box1Body: `The loser takes the Topper Value-Add suggestions from both copies, rewrites the flawed paragraphs on fresh paper, and re-uploads to the Rewrite Lab.`,
            box2Title: "🧠 RESULT AFTER 30 DAYS OF CHAI DUELS",
            box2Tag: "30 TOPPER ANSWERS",
            box2Color: "emerald",
            box2Body: `1 Duel/night = 30 ruthlessly audited, rewritten, rank-1 standard answers in your pocket every single month—for ₹0.`,
            footerLeft: "Who are you challenging tonight?",
            footerRight: "FINAL SLIDE →"
          },
          {
            theme: "cta-finale",
            badge: "☕ SHARE THIS IN YOUR TELEGRAM / STUDY GROUP",
            slideNum: "05 / 05",
            headline: `Drop This In Your Study Group &amp; <span class="italic text-amber-400">Start Tonight’s 9 PM Duel.</span>`,
            subtext: `Both of you get 15 Free Handwritten Evaluations + 5 Free Rewrites every single day on Cooked Mains.`,
            stat1: ["1v1 Ready", "Live Daily Hindu/IE Questions"],
            stat2: ["30 Secs", "Instant Unbiased Referee"],
            stat3: ["100% Free", "15 Copies/Day Per Aspirant"],
            ctaText: "🔗 cookedmains.com (Link in Bio)",
            footerNote: "✈️ Share to your study partner right now — no backing out!"
          }
        ]
      }
    };

    let activeDeckKey = 'minimal_singles';
    let activeSlideIdx = 0;

    function renderSlideHTML(slide) {
      if (slide.theme === 'cta-finale') {
        return `
          <div id="exportTargetCard" class="relative w-[540px] h-[675px] rounded-[28px] overflow-hidden bg-[#0A0A0C] text-white border border-zinc-800 shadow-2xl flex flex-col justify-between p-8 select-none">
            <div class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-[450px] h-[250px] bg-amber-500/20 blur-[95px] rounded-full"></div>
            <div class="pointer-events-none absolute inset-0 grain-overlay"></div>
            <div class="relative z-10 flex items-center justify-between">
              <div class="flex items-center gap-2"><img src="/static/brand_logo_dark.png" onerror="this.style.display='none'" class="h-8 w-auto" alt="Logo" /><span class="text-sm font-extrabold">COOKED <span class="text-amber-400">MAINS</span></span></div>
              <span class="font-mono-code text-[10px] text-amber-400 px-2.5 py-0.5 rounded-full border border-amber-500/30 bg-amber-500/10">${slide.slideNum}</span>
            </div>
            <div class="relative z-10 text-center space-y-3.5 my-auto">
              <div class="inline-block px-3.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 font-mono-code text-[10.5px] font-bold" contenteditable="true">${slide.badge}</div>
              <h2 class="font-editorial text-[46px] leading-[0.98]" contenteditable="true">${slide.headline}</h2>
              <p class="text-xs text-zinc-300 max-w-[430px] mx-auto leading-relaxed" contenteditable="true">${slide.subtext}</p>
              <div class="grid grid-cols-3 gap-2.5 pt-2 text-left">
                <div class="p-3 rounded-2xl bg-zinc-900 border border-zinc-800"><div class="font-mono-code text-base font-extrabold text-amber-400" contenteditable="true">${slide.stat1[0]}</div><div class="text-[10px] text-zinc-400 mt-0.5" contenteditable="true">${slide.stat1[1]}</div></div>
                <div class="p-3 rounded-2xl bg-zinc-900 border border-zinc-800"><div class="font-mono-code text-base font-extrabold text-emerald-400" contenteditable="true">${slide.stat2[0]}</div><div class="text-[10px] text-zinc-400 mt-0.5" contenteditable="true">${slide.stat2[1]}</div></div>
                <div class="p-3 rounded-2xl bg-zinc-900 border border-zinc-800"><div class="font-mono-code text-base font-extrabold text-sky-400" contenteditable="true">${slide.stat3[0]}</div><div class="text-[10px] text-zinc-400 mt-0.5" contenteditable="true">${slide.stat3[1]}</div></div>
              </div>
              <div class="pt-3"><div class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-400 text-zinc-950 font-extrabold text-sm tracking-tight shadow-xl" contenteditable="true">${slide.ctaText}</div></div>
            </div>
            <div class="relative z-10 pt-3 border-t border-zinc-800 flex items-center justify-between text-[10.5px] text-zinc-400">
              <span contenteditable="true">${slide.footerNote}</span>
              <span class="font-mono-code text-amber-400 font-bold">LET ME COOK</span>
            </div>
          </div>
        `;
      }

      if (slide.theme === 'paper-archival') {
        return `
          <div id="exportTargetCard" class="relative w-[540px] h-[675px] rounded-[28px] overflow-hidden bg-[#F7F3EB] text-[#141413] border border-stone-300 shadow-2xl flex flex-col justify-between p-8 select-none">
            <div class="flex items-center justify-between border-b-2 border-[#141413] pb-3">
              <div class="flex items-center gap-2"><img src="/static/brand_logo_light.png" onerror="this.style.display='none'" class="h-6 w-auto" alt="Logo" /><span class="font-mono-code text-[11px] font-extrabold uppercase tracking-wider" contenteditable="true">${slide.badge}</span></div>
              <span class="font-mono-code text-[10px] px-2.5 py-0.5 rounded-full bg-[#141413] text-[#F7F3EB] font-bold">${slide.slideNum}</span>
            </div>
            <div class="my-1"><h2 class="font-editorial text-[44px] leading-[0.98] tracking-tight" contenteditable="true">${slide.headline}</h2><p class="text-xs text-stone-600 mt-2 leading-relaxed" contenteditable="true">${slide.subtext}</p></div>
            <div class="space-y-3 my-1">
              <div class="p-4 rounded-2xl bg-white border-2 border-[#141413] shadow-sm"><div class="flex items-center justify-between mb-1.5"><span class="font-mono-code text-[10px] font-extrabold text-rose-700" contenteditable="true">${slide.box1Title}</span><span class="font-mono-code text-[10px] font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-800" contenteditable="true">${slide.box1Tag}</span></div><p class="text-xs text-stone-800 whitespace-pre-line leading-relaxed" contenteditable="true">${slide.box1Body}</p></div>
              <div class="p-4 rounded-2xl bg-[#141413] text-[#F7F3EB] border-2 border-[#141413] shadow-lg"><div class="flex items-center justify-between mb-1.5"><span class="font-mono-code text-[10px] font-extrabold text-amber-400" contenteditable="true">${slide.box2Title}</span><span class="font-mono-code text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300" contenteditable="true">${slide.box2Tag}</span></div><p class="text-xs text-stone-200 whitespace-pre-line leading-relaxed" contenteditable="true">${slide.box2Body}</p></div>
            </div>
            <div class="pt-3 border-t-2 border-[#141413] flex items-center justify-between"><span class="font-mono-code text-[11px] text-stone-600" contenteditable="true">${slide.footerLeft}</span><span class="font-mono-code text-xs font-extrabold text-rose-700" contenteditable="true">${slide.footerRight}</span></div>
          </div>
        `;
      }

      const colorMap = {
        emerald: "border-emerald-500/40 bg-emerald-950/20 text-emerald-400",
        rose: "border-rose-500/45 bg-rose-950/25 text-rose-400",
        amber: "border-amber-500/40 bg-amber-950/20 text-amber-400",
        sky: "border-sky-500/40 bg-sky-950/20 text-sky-400"
      };
      const c1 = colorMap[slide.box1Color] || colorMap.amber;
      const c2 = colorMap[slide.box2Color] || colorMap.emerald;

      return `
        <div id="exportTargetCard" class="relative w-[540px] h-[675px] rounded-[28px] overflow-hidden bg-[#0A0A0C] text-white border border-zinc-800 shadow-2xl flex flex-col justify-between p-8 select-none">
          <div class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-[420px] h-[220px] bg-amber-500/15 blur-[95px] rounded-full"></div>
          <div class="pointer-events-none absolute inset-0 grain-overlay"></div>
          <div class="relative z-10 flex items-center justify-between"><span class="px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-700 text-[10px] font-mono-code font-bold text-amber-400" contenteditable="true">${slide.badge}</span><span class="font-mono-code text-[10px] text-zinc-400 px-2.5 py-0.5 rounded-full border border-zinc-800">${slide.slideNum}</span></div>
          <div class="relative z-10 my-1"><h1 class="font-editorial text-[44px] leading-[0.98] tracking-tight text-white" contenteditable="true">${slide.headline}</h1><p class="text-xs text-zinc-400 mt-2 leading-relaxed" contenteditable="true">${slide.subtext}</p></div>
          <div class="relative z-10 space-y-3 my-1">
            <div class="p-4 rounded-2xl border ${c1}"><div class="flex items-center justify-between mb-1.5"><span class="text-[10px] font-mono-code uppercase font-bold" contenteditable="true">${slide.box1Title}</span><span class="text-[10px] font-mono-code px-2 py-0.5 rounded bg-zinc-900/90 text-white font-bold" contenteditable="true">${slide.box1Tag}</span></div><p class="text-xs text-zinc-200 whitespace-pre-line leading-relaxed" contenteditable="true">${slide.box1Body}</p></div>
            <div class="p-4 rounded-2xl border ${c2}"><div class="flex items-center justify-between mb-1.5"><span class="text-[10px] font-mono-code uppercase font-bold" contenteditable="true">${slide.box2Title}</span><span class="text-[10px] font-mono-code px-2 py-0.5 rounded bg-zinc-900/90 text-white font-extrabold" contenteditable="true">${slide.box2Tag}</span></div><p class="text-xs text-zinc-100 whitespace-pre-line leading-relaxed" contenteditable="true">${slide.box2Body}</p></div>
          </div>
          <div class="relative z-10 pt-3 border-t border-zinc-800 flex items-center justify-between"><span class="text-[11px] text-zinc-400 font-mono-code" contenteditable="true">${slide.footerLeft}</span><span class="font-mono-code text-xs font-extrabold text-amber-400" contenteditable="true">${slide.footerRight}</span></div>
        </div>
      `;
    }

    function switchDeck(deckKey) {
      activeDeckKey = deckKey;
      activeSlideIdx = 0;

      ['minimal_singles', 'concept1', 'concept2', 'concept3', 'concept4'].forEach(k => {
        const btn = document.getElementById('tab-' + k);
        if (!btn) return;
        if (k === deckKey) {
          btn.className = 'px-3 py-1.5 rounded-lg text-[11px] font-bold bg-amber-500 text-slate-950 transition cursor-pointer';
        } else {
          btn.className = 'px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-slate-300 hover:text-white transition cursor-pointer';
        }
      });

      renderSubBarAndCanvas();
    }

    function selectSlide(idx) {
      activeSlideIdx = idx;
      renderSubBarAndCanvas();
    }

    function renderSubBarAndCanvas() {
      const bar = document.getElementById('slideSelectorBar');
      const mount = document.getElementById('canvasMount');
      const deck = DECKS[activeDeckKey];

      bar.innerHTML = `<span class="text-[11px] font-mono-code uppercase text-amber-400 font-bold mr-2">${deck.name}:</span>` +
        deck.labels.map((l, idx) => `
          <button onclick="selectSlide(${idx})" class="px-3 py-1 rounded-lg text-xs font-mono-code font-bold cursor-pointer ${idx === activeSlideIdx ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:text-white'}">${l}</button>
        `).join('');

      if (activeDeckKey === 'minimal_singles') {
        mount.innerHTML = renderMinimalSingleAd(activeSlideIdx);
      } else {
        mount.innerHTML = renderSlideHTML(deck.slides[activeSlideIdx]);
      }
    }

    async function exportCurrentSlide() {
      const btn = document.getElementById('exportOneBtn');
      const prev = btn.innerHTML;
      btn.innerHTML = '<span>Rendering PNG...</span>';
      btn.disabled = true;
      try {
        const target = document.getElementById('exportTargetCard');
        const canvas = await html2canvas(target, { scale: 2.5, useCORS: true, backgroundColor: null });
        const link = document.createElement('a');
        link.download = `CookedMains_${activeDeckKey}_0${activeSlideIdx + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        alert('Export error: ' + e.message);
      } finally {
        btn.innerHTML = prev;
        btn.disabled = false;
        lucide.createIcons();
      }
    }

    async function exportAllSlidesInActiveDeck() {
      const btn = document.getElementById('exportAllBtn');
      const prev = btn.innerHTML;
      btn.disabled = true;
      const savedIdx = activeSlideIdx;

      try {
        for (let i = 0; i < 5; i++) {
          btn.innerHTML = `<span>Exporting ${i + 1}/5...</span>`;
          selectSlide(i);
          await new Promise(r => setTimeout(r, 180));
          const target = document.getElementById('exportTargetCard');
          const canvas = await html2canvas(target, { scale: 2.5, useCORS: true, backgroundColor: null });
          const link = document.createElement('a');
          link.download = `CookedMains_${activeDeckKey}_0${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          await new Promise(r => setTimeout(r, 250));
        }
      } catch (e) {
        alert('Batch export error: ' + e.message);
      } finally {
        selectSlide(savedIdx);
        btn.innerHTML = prev;
        btn.disabled = false;
        lucide.createIcons();
      }
    }

    lucide.createIcons();
    switchDeck('minimal_singles');
  </script>
</body>
</html>
